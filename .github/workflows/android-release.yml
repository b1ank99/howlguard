name: Build signed Android bundle (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: android-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager "platform-tools" "build-tools;36.1.0" "platforms;android-36" "ndk;29.0.14206865" "cmake;3.10.2.4988404"
      - run: bash tools/install-godot.sh
      - run: python3 tools/configure-android.py
      - run: godot --headless --editor --import --quit
      - name: Install matching Android Gradle source
        run: |
          mkdir -p android/build
          unzip -q "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_source.zip" -d android/build
          printf '4.7.2.stable' > android/.build_version
          chmod +x android/build/gradlew
          python3 tools/prepare-gradle.py
      - name: Decode private upload key
        env:
          UPLOAD_KEY: ${{ secrets.ANDROID_UPLOAD_KEY_BASE64 }}
        run: |
          test -n "$UPLOAD_KEY"
          printf '%s' "$UPLOAD_KEY" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          chmod 600 "$RUNNER_TEMP/upload.keystore"
      - name: Export release AAB without submitting
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/upload.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$GODOT_ANDROID_KEYSTORE_RELEASE_USER"
          test -n "$GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD"
          mkdir -p build/android
          godot --headless --export-release "Android AAB" build/android/howlguard-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: howlguard-release-aab
          path: build/android/*.aab
      - name: Remove ephemeral key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"
