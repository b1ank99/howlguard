services:
  game:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 9080
      BIND_ADDRESS: 0.0.0.0
    expose:
      - '9080'
    read_only: true
    tmpfs:
      - /tmp
      - /home/game:uid=10001,gid=10001
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your public DNS name}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - game
volumes:
  caddy_data:
  caddy_config:
